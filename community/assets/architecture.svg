<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc">
  <title id="title">RustSwitch 分层架构与当前实现边界</title>
  <desc id="desc">Go 控制面管理受限 SIP 接入、呼叫、IVR、ESL 与准入，通过媒体 IPC 管理 Rust 媒体分片。Rust 处理 RTP 与 RTCP、G.711 实时音频图、PCM 下行中断与 RX 收音，通过 C ABI 接入原生编解码。ASR1 为独立候选实现；真实 ASR、LLM、TTS、VAD 自动打断为待接入能力。实线表示主线已有路径，虚线表示候选或待接入，不表示全部 FreeSWITCH 兼容。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 6 4 1 7" fill="none" stroke="#288577" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="future" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 6 4 1 7" fill="none" stroke="#a57539" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="970" rx="22" fill="#f1f6f4"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="48" y="60" font-size="15" font-weight="700" letter-spacing="2.5" fill="#3e786d">ARCHITECTURE</text>
    <text x="48" y="108" font-size="36" font-weight="750" fill="#133d36">电话接入与 AI 音频，分层演进</text>
    <text x="48" y="143" font-size="17" fill="#506c63">主线能力与候选实现分别交付；兼容范围以接口合同和验证记录为准。</text>
    <!-- 实线表示主线已接入路径；不表示路径内所有协议语义均已实现。 -->
    <g stroke="#288577" stroke-width="2.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M268 258H326"/>
      <path d="M874 258H922"/>
      <path d="M600 350V413"/>
      <path d="M268 528H326"/>
      <path d="M600 660V724"/>
    </g>
    <rect x="528" y="370" width="144" height="25" rx="12" fill="#f1f6f4"/>
    <text x="600" y="387" text-anchor="middle" font-size="14" fill="#3f6c60">媒体控制 IPC</text>
    <rect x="550" y="680" width="100" height="24" rx="12" fill="#f1f6f4"/>
    <text x="600" y="697" text-anchor="middle" font-size="14" fill="#3f6c60">原生 C ABI</text>
    <!-- 电话信令、电话媒体分别进入控制面和媒体面。 -->
    <rect x="48" y="196" width="220" height="154" rx="16" fill="#fff" stroke="#bfd3ca"/>
    <text x="70" y="231" font-size="13" letter-spacing="1.5" fill="#5c7d71">TELEPHONY</text>
    <text x="70" y="270" font-size="25" font-weight="700" fill="#163e34">电话信令</text>
    <text x="70" y="302" font-size="17" fill="#48675a">可信 SIP 线路</text>
    <text x="70" y="330" font-size="15" fill="#48675a">UDP / TCP / TLS 子集</text>
    <rect x="48" y="449" width="220" height="158" rx="16" fill="#fff" stroke="#bfd3ca"/>
    <text x="70" y="484" font-size="13" letter-spacing="1.5" fill="#5c7d71">AUDIO TRANSPORT</text>
    <text x="70" y="523" font-size="25" font-weight="700" fill="#163e34">双向通话媒体</text>
    <text x="70" y="555" font-size="17" fill="#48675a">RTP / RTCP</text>
    <text x="70" y="583" font-size="15" fill="#48675a">协商后的 telephone-event</text>
    <!-- 主线 Go 控制面与 Rust 媒体内核。 -->
    <rect x="326" y="196" width="548" height="154" rx="16" fill="#e1f0e9" stroke="#80b7a3"/>
    <text x="354" y="231" font-size="14" font-weight="700" letter-spacing="1.2" fill="#47816b">GO · CONTROL PLANE</text>
    <text x="354" y="272" font-size="29" font-weight="750" fill="#173e32">呼叫与服务控制</text>
    <text x="354" y="307" font-size="17" fill="#3e6955">呼叫生命周期 · 受限注册 / IVR / 入站 ESL</text>
    <text x="354" y="332" font-size="17" fill="#3e6955">峰值准入 · 定时器 · 进程监管 · 事件日志</text>
    <rect x="326" y="413" width="548" height="247" rx="18" fill="#113d36"/>
    <text x="354" y="450" font-size="14" font-weight="700" letter-spacing="1.2" fill="#83d4ba">RUST · MEDIA CORE</text>
    <text x="354" y="491" font-size="30" font-weight="750" fill="#f0fff8">实时媒体分片</text>
    <text x="354" y="531" font-size="18" fill="#c4e5d6">RTP / RTCP 校验与转发 · 固定槽位 · 有界队列</text>
    <line x1="354" y1="552" x2="846" y2="552" stroke="#3a6657"/>
    <text x="354" y="584" font-size="18" fill="#f0fff8">G.711 实时音频图</text>
    <text x="354" y="614" font-size="17" fill="#c4e5d6">播放 / 收号 · PCM 下行与中断 · RX 收音</text>
    <text x="354" y="641" font-size="14" fill="#94c2ac">内部收发音频合同 ≠ 已接入完整生产 Agent</text>
    <rect x="326" y="724" width="548" height="134" rx="16" fill="#fff" stroke="#9fbcaf"/>
    <text x="354" y="758" font-size="14" font-weight="700" letter-spacing="1" fill="#4e7c68">C/C++ · NATIVE ECOSYSTEM</text>
    <text x="354" y="794" font-size="25" font-weight="700" fill="#173e32">版本化适配接口与原生编解码</text>
    <text x="354" y="824" font-size="16" fill="#486b59">G.711 插件 · G.722 / Opus 后端独立探测</text>
    <text x="354" y="846" font-size="14" fill="#677f71">支持矩阵区分协商、透传、编解码与实时处理</text>
    <!-- 中文控制台使用现有 HTTP 接口，不需要独立前端服务。 -->
    <rect x="922" y="196" width="230" height="154" rx="16" fill="#fff" stroke="#bfd3ca"/>
    <text x="944" y="231" font-size="13" letter-spacing="1" fill="#5c7d71">OPERATIONS</text>
    <text x="944" y="270" font-size="25" font-weight="700" fill="#163e34">中文管理后台</text>
    <text x="944" y="302" font-size="16" fill="#48675a">HTTP API · 配置 · 压测</text>
    <text x="944" y="330" font-size="16" fill="#48675a">指标 · 接口文档 · 对照表</text>
    <!-- ASR1 为单独候选代码；真实模型供应商仍待接入。 -->
    <g stroke="#a57539" stroke-width="2.3" stroke-dasharray="7 6" fill="none" marker-end="url(#future)">
      <path d="M874 499H922"/>
      <path d="M1037 579V679"/>
    </g>
    <rect x="922" y="413" width="230" height="166" rx="16" fill="#fff8eb" stroke="#bc9a65" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="944" y="447" font-size="13" font-weight="700" fill="#997037">独立候选 · ASR1</text>
    <text x="944" y="487" font-size="25" font-weight="700" fill="#66502d">ASR 流适配</text>
    <text x="944" y="523" font-size="16" fill="#796449">协议合同 · 队列 · 超时</text>
    <text x="944" y="552" font-size="15" fill="#796449">mock 与故障回归用例</text>
    <text x="1051" y="627" font-size="14" fill="#997037">待接入</text>
    <rect x="922" y="679" width="230" height="179" rx="16" fill="#fff8eb" stroke="#bc9a65" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="944" y="714" font-size="13" font-weight="700" fill="#997037">EXTERNAL AI</text>
    <text x="944" y="754" font-size="25" font-weight="700" fill="#66502d">真实语音智能体</text>
    <text x="944" y="791" font-size="17" fill="#796449">ASR · LLM · TTS</text>
    <text x="944" y="823" font-size="16" fill="#796449">VAD 自动打断与闭环</text>
    <text x="944" y="845" font-size="14" fill="#796449">完整链路验收尚待完成</text>
    <line x1="48" y1="906" x2="97" y2="906" stroke="#288577" stroke-width="3"/>
    <text x="110" y="912" font-size="16" fill="#3e6453">主线已有路径</text>
    <line x1="280" y1="906" x2="329" y2="906" stroke="#a57539" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="342" y="912" font-size="16" fill="#6c5f43">候选 / 待接入</text>
    <text x="1152" y="912" text-anchor="end" font-size="15" fill="#65796d">开发预览 · 逐项兼容 · 证据驱动</text>
    <text x="48" y="945" font-size="14" fill="#6c8074">图中实线表示实现路径存在，不代表全量协议兼容、生产就绪或已通过 5,000 / 10,000 路验收。</text>
  </g>
</svg>
